name: DGT authenticated download
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dgt-authenticated.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Login and request Pedome tiles
        env:
          DGT_USERNAME: ${{ secrets.DGT_USERNAME }}
          DGT_PASSWORD: ${{ secrets.DGT_PASSWORD }}
        run: |
          test -n "$DGT_USERNAME" && test -n "$DGT_PASSWORD" || { echo "::error::Configure DGT_USERNAME and DGT_PASSWORD in Actions secrets"; exit 1; }
          python -u tools/download-dgt-pedome.py --login --output /tmp/dgt-pedome --collection MDT-50cm --collection MDS-50cm
      - name: Save verification report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgt-auth-download-report
          path: /tmp/dgt-pedome/manifest.json
          if-no-files-found: warn
