name: MapSlop PR CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Reproducible setup
        run: |
          make setup
          .venv/bin/python -m pip install -r requirements-terrain.txt
      - name: Offline repository and data workflow tests
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python tools/check-repo.py
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python -m compileall -q tools
          node --check tools/pedome-ui.js
          node --check tools/import-osm.mjs
          node --check tests/browser-smoke.mjs
      - name: Fixture and real Pedome builds
        run: |
          .venv/bin/python tools/prepare-pedome.py .cache/mapslop/nairobi outputs/fixture --fixture --three-vendor .cache/mapslop/three-vendor
          make build
          make test
          .venv/bin/python -c 'import json; d=json.load(open("pedome/build-report.json")); assert not d["fixture"] and d["flat"] and d["roads"]==179 and d["buildings"]==527, d; print("BUILD_REPORT",json.dumps(d))'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and two-finger touch smoke test
        shell: bash
        env:
          MAPSLOP_TEST_URL: http://127.0.0.1:8080/?webgl
          MAPSLOP_RESULTS: /tmp/pedome-results
        run: |
          set -euo pipefail
          mkdir -p /tmp/pedome-results
          make serve PORT=8080 > /tmp/pedome-results/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
      - name: Build and test non-flat synthetic terrain (no DGT data)
        env:
          MAPSLOP_TEST_URL: http://127.0.0.1:8081/?webgl
          MAPSLOP_RESULTS: /tmp/pedome-terrain-test
          MAPSLOP_EXPECT_TERRAIN: SYNTHETIC TEST TERRAIN
        run: |
          set -euo pipefail
          mkdir -p outputs /tmp/pedome-terrain-test
          .venv/bin/python -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); from terrain_grid import synthetic_grid; from terrain_binary import save; save(Path("outputs/synthetic-terrain.bin"),synthetic_grid(5))'
          .venv/bin/python tools/prepare-pedome.py .cache/mapslop/nairobi outputs/nonflat --osm-json data/pedome/pedome-osm.json --terrain-bin outputs/synthetic-terrain.bin --export-footprints outputs/ci-footprints.json --three-vendor .cache/mapslop/three-vendor
          make serve OUT=outputs/nonflat PORT=8081 > /tmp/pedome-terrain-test/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8081/ >/dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
      - name: Generate synthetic TIN and validate rendering, draping and 100 m physics
        env:
          MAPSLOP_TEST_URL: http://127.0.0.1:8082/?webgl
          MAPSLOP_RESULTS: /tmp/pedome-tin-test
          MAPSLOP_EXPECT_TERRAIN: SYNTHETIC TEST TERRAIN
          MAPSLOP_LONG_DRIVE: '1'
          MAPSLOP_EXPECT_BUILDINGS: synthetic_mds_mdt
        run: |
          set -euo pipefail
          mkdir -p outputs /tmp/pedome-tin-test
          .venv/bin/python -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); from terrain_tin import synthetic_tin; from terrain_binary import save; save(Path("outputs/synthetic-tin.bin"),synthetic_tin())'
          .venv/bin/python tools/synthetic-building-report.py --footprints outputs/ci-footprints.json --terrain outputs/synthetic-tin.bin --output outputs/synthetic-heights.json
          .venv/bin/python tools/prepare-pedome.py .cache/mapslop/nairobi outputs/tin --osm-json data/pedome/pedome-osm.json --terrain-bin outputs/synthetic-tin.bin --building-heights outputs/synthetic-heights.json --three-vendor .cache/mapslop/three-vendor
          make serve OUT=outputs/tin PORT=8082 > /tmp/pedome-tin-test/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8082/ >/dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-evidence
          path: |
            /tmp/pedome-results/
            pedome/build-report.json
            /tmp/pedome-terrain-test/
            outputs/nonflat/build-report.json
            /tmp/pedome-tin-test/
            outputs/tin/build-report.json
          if-no-files-found: warn
