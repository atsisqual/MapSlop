name: Archive DGT LAZ point clouds
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dgt-laz.yml'
permissions:
  contents: write
concurrency:
  group: dgt-pedome-laz-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Collect original files using DGT account
        id: collect
        continue-on-error: true
        env:
          DGT_USERNAME: ${{ secrets.DGT_USERNAME }}
          DGT_PASSWORD: ${{ secrets.DGT_PASSWORD }}
        run: |
          test -n "$DGT_USERNAME" && test -n "$DGT_PASSWORD"
          python -u tools/collect-dgt-pedome.py --output /tmp/dgt-expanded --collection LAZ
      - name: Preserve verified downloads in unpublished draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dgt-expanded
          test -f manifest.json
          tag=geodata-dgt-pedome-20261127
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/dgt-draft-status; then
            test "$(cat /tmp/dgt-draft-status)" = true
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "DGT — Pedome e arredores, fonte geográfica" --notes "Archive of DGT data for expanded bounding box -8.405,41.405,-8.375,41.435. Attribution: Direção-Geral do Território (DGT). Official LiDAR open-data policy: https://www.dgterritorio.gov.pt/descarregamento-de-dados-lidar-de-portugal-continental ; DGT CC BY 4.0 policy: https://www.dgterritorio.gov.pt/dados-abertos ; orthophotos: https://www.dgterritorio.gov.pt/novo-catalogo-de-ortofotos-de-portugal-continental-no-centro-de-dados-da-dgt . Kept unpublished pending reconciliation of inconsistent per-collection license metadata. No account credentials or signed URLs. Not a game release."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/dgt-existing
          python - <<'PY'
          import json,hashlib,pathlib
          m=json.load(open('manifest.json'))
          for e in m['items']:
              if not e['ok']: continue
              p=pathlib.Path(e['filename'])
              assert p.is_file() and p.stat().st_size==e['bytes']
              with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==e['sha256']
          PY
          count=0
          while IFS= read -r f; do
            if grep -Fxq "$f" /tmp/dgt-existing; then
              echo "Already archived: $f"
            elif [ "$(stat -c%s "$f")" -lt 2147483648 ]; then
              gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
            else
              echo "::warning::Asset exceeds per-file release limit: $f"
              continue
            fi
            count=$((count+1))
          done < <(jq -r '.items[] | select(.ok) | .filename' manifest.json)
          cp manifest.json "manifest-${GITHUB_RUN_ID}.json"
          gh release upload "$tag" "manifest-${GITHUB_RUN_ID}.json" --repo "$GITHUB_REPOSITORY"
          echo "Archived/previously present: $count assets."
          test "$count" -gt 0
      - name: Upload metadata report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgt-laz-report
          path: /tmp/dgt-expanded/manifest.json
          if-no-files-found: warn
      - name: Mark partial collection honestly
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::At least one collection or asset failed; successful downloads archived."
          exit 1
