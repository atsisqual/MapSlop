name: Publish MapSlop preview to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'tools/prepare-pedome.py'
      - 'tools/pedome-ui.js'
      - 'tools/terrain-binary.mjs'
      - 'tools/terrain_binary.py'
      - 'tools/verify-pages-terrain.py'
      - 'tools/tin-runtime.mjs'
      - 'tests/browser-smoke.mjs'
      - 'package-lock.json'
      - 'data/pedome/pedome-osm.json'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mapslop-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # GitHub requires write access to retrieve draft release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Fetch exact upstream and Three.js revisions
        run: |
          git init /tmp/nairobi
          git -C /tmp/nairobi remote add origin https://github.com/briankariuki/slop-nairobi.git
          git -C /tmp/nairobi fetch --depth=1 origin 64b8599ae7dd7ba56ffbe68f19cc1423a9e7f903
          git -C /tmp/nairobi checkout --detach FETCH_HEAD
          git init /tmp/three
          git -C /tmp/three remote add origin https://github.com/mrdoob/three.js.git
          git -C /tmp/three sparse-checkout set build examples/jsm
          git -C /tmp/three fetch --depth=1 --filter=blob:none origin f17eb5d689094a3fbd4cd0d64d54729a48036ce0
          git -C /tmp/three checkout --detach FETCH_HEAD
          mkdir -p /tmp/three-vendor
          cp -r /tmp/three/build /tmp/three/examples /tmp/three/LICENSE /tmp/three-vendor/
      - name: Retrieve only the approved immutable TIN derivative
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=geodata-dgt-terrain-agent-tin-compact-binary
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          mkdir -p /tmp/pages-terrain
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/pages-terrain --pattern terrain-tin.bin --pattern validation.json
          python tools/verify-pages-terrain.py /tmp/pages-terrain
      - name: Build actual Pedome map with the approved compact TIN
        run: python tools/prepare-pedome.py /tmp/nairobi /tmp/pedome --osm-json data/pedome/pedome-osm.json --terrain-bin /tmp/pages-terrain/terrain-tin.bin --three-vendor /tmp/three-vendor
      - name: Stage only runtime, public OSM source and verified compressed TIN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/site/MapSlop
          python - <<'PY'
          import pathlib, re, shutil
          src=pathlib.Path('/tmp/pedome')
          dst=pathlib.Path('/tmp/site/MapSlop')
          pending=['index.html','js/pedome.js']
          seen=set()
          # Copy ES module dependencies, not the upstream development tools, tests or capture data.
          aliases={'three':'vendor/three/build/three.webgpu.js','three/webgpu':'vendor/three/build/three.webgpu.js','three/tsl':'vendor/three/build/three.tsl.js'}
          while pending:
              rel=pending.pop()
              if rel in seen: continue
              seen.add(rel)
              f=src/rel
              if not f.is_file(): raise RuntimeError('Missing runtime dependency: '+rel)
              out=dst/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(f,out)
              if not rel.endswith(('.js','.mjs')): continue
              for name in re.findall(r"""(?:\bfrom\s*|\bimport\s*\(?\s*)['"]([^'"]+)['"]""",f.read_text(encoding='utf-8')):
                  if name.startswith('.'):
                      target=(f.parent/name).resolve()
                      if target.is_relative_to(src): pending.append(str(target.relative_to(src)))
                  elif name in aliases: pending.append(aliases[name])
                  elif name.startswith('three/addons/'): pending.append('vendor/three/examples/jsm/'+name[len('three/addons/'):])
          # Serve the exact deterministic gzip payload, even if the CDN does not gzip .bin.
          shutil.copy2('/tmp/pages-terrain/terrain-tin.bin.gz',dst/'js/terrain.bin.gz')
          geodata=dst/'js/nairobi-geodata.js'
          g=geodata.read_text(encoding='utf-8')
          assert g.count("./terrain.bin'")==1
          geodata.write_text(g.replace("./terrain.bin'","./terrain.bin.gz'"),encoding='utf-8')
          assert not (dst/'js/terrain.bin').exists()
          shutil.copy2(src/'vendor/three/LICENSE',dst/'THREE-LICENSE.txt')
          shutil.copy2(src/'UPSTREAM-README.md',dst/'UPSTREAM-README.md')
          shutil.copy2('data/pedome/pedome-osm.json',dst/'pedome-osm.json')
          shutil.copy2('data/pedome/README.md',dst/'OSM-DATA.md')
          shutil.copy2(src/'build-report.json',dst/'build-report.json')
          (dst/'.nojekyll').touch()
          print('Staged',len(seen),'runtime files')
          PY
          cat > /tmp/site/MapSlop/LICENSE-CODE.txt <<'EOF'
          MapSlop preview — adapted from Slop Cities Nairobi by its contributors
          (https://github.com/briankariuki/slop-nairobi/tree/64b8599ae7dd7ba56ffbe68f19cc1423a9e7f903).
          Upstream README declares code MIT; parts adapted from Slop New York.
          MIT License

          Copyright (c) 2026 Mr.doob (Slop New York)
          Copyright (c) Slop Cities Nairobi contributors (Nairobi adaptations)

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          cat > /tmp/site/MapSlop/ATTRIBUTION.html <<'EOF'
          <!doctype html><html lang="pt"><meta charset="utf-8"><title>MapSlop — Créditos</title>
          <h1>MapSlop — prévia experimental de Pedome</h1>
          <p>Dados geográficos © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, <a href="https://opendatacommons.org/licenses/odbl/1-0/">ODbL 1.0</a>. <a href="pedome-osm.json">Dados de origem</a> e <a href="js/nairobi-geodata.js">base derivada</a>. <a href="OSM-DATA.md">Proveniência</a>.</p>
          <p>Código adaptado de Slop Cities Nairobi (MIT declarado no README upstream) e Slop New York. <a href="LICENSE-CODE.txt">Licença</a> · <a href="UPSTREAM-README.md">README upstream</a> · <a href="THREE-LICENSE.txt">Three.js MIT</a> · <a href="https://github.com/atsisqual/MapSlop">Projeto e código de adaptação</a>.</p>
          <p>Terreno: <a href="https://www.dgterritorio.gov.pt/dados-abertos">© Direção-Geral do Território</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Derivado do MDT LiDAR de 0,5 m, recortado, reamostrado, triangulado e comprimido por MapSlop. <a href="https://dados.gov.pt/pt/datasets/dados-lidar-de-portugal-continental/">Fonte e licença</a>. Run de validação <a href="https://github.com/atsisqual/MapSlop/actions/runs/46063386111">46063386111</a>.</p>
          <p>Alturas de edifícios maioritariamente estimadas. Sem rasters ou LAZ originais DGT, assets capturados de PortoSlop ou Nairobi, ou credenciais.</p>
          <p><a href="./?webgl">Voltar ao jogo</a></p></html>
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/site/MapSlop/index.html')
          s=p.read_text()
          assert 'DGT — MDT 0,5 m (uso experimental)' in s
          s=s.replace('DGT — MDT 0,5 m (uso experimental)', '<a href="https://creativecommons.org/licenses/by/4.0/">© Direção-Geral do Território, CC BY 4.0</a> · <a href="./ATTRIBUTION.html">Créditos e dados</a>')
          # Give each release a new entry-point URL, including the HUD module.
          import os
          root=p.parent
          version=os.environ['GITHUB_SHA'][:12]
          main=root/'js/pedome.js'
          hud=root/'js/pedome-ui.js'
          hud_name='pedome-ui-'+version+'.js'
          main_name='pedome-'+version+'.js'
          (hud.parent/hud_name).write_text(hud.read_text(),encoding='utf-8')
          (main.parent/main_name).write_text(main.read_text().replace('./pedome-ui.js','./'+hud_name),encoding='utf-8')
          s=s.replace('./js/pedome.js','./js/'+main_name)
          s=s.replace('</style>','</style><meta name="mapslop-build" content="'+version+'">')
          s=s.replace('A construir mapa…','A construir mapa e comandos táteis…')
          p.write_text(s,encoding='utf-8')
          (root/'mobile.html').write_text(s,encoding='utf-8')
          (root/'version.txt').write_text(version+'\n',encoding='utf-8')
          PY
      - name: Install pinned Playwright and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render and drive
        shell: bash
        env:
          MAPSLOP_TEST_URL: http://127.0.0.1:8080/MapSlop/mobile.html?webgl
          MAPSLOP_RESULTS: /tmp/pedome-results
          MAPSLOP_EXPECT_TERRAIN: DGT MDT 0.5 m
          MAPSLOP_LONG_DRIVE: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/pedome-results
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/site > /tmp/pedome-results/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8080/MapSlop/ >/dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
          node --input-type=module - <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for (const entry of ['index.html','mobile.html']) {
              const page=await browser.newPage({viewport:{width:823,height:384}});
              await page.goto('http://127.0.0.1:8080/MapSlop/'+entry+'?webgl');
              const credit=page.locator('#credits').getByText('© Direção-Geral do Território, CC BY 4.0',{exact:true});
              await credit.waitFor({state:'visible'});
              await page.close();
            }
          } finally { await browser.close(); }
          JS
          grep -Fq '© Direção-Geral do Território, CC BY 4.0' /tmp/site/MapSlop/mobile.html
          grep -Fq '© Direção-Geral do Território, CC BY 4.0' /tmp/site/MapSlop/index.html
          test "$(sha256sum /tmp/site/MapSlop/js/terrain.bin.gz | cut -d' ' -f1)" = 9009db14b6808e36f3457db525eef2589328ac2769fe1899a8d53598efc0758d
      # No public diagnostics upload: deploy only the tested, curated site.
      - name: Upload tested static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site/MapSlop
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public mobile page is this exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          base="https://atsisqual.github.io/MapSlop"
          version="${GITHUB_SHA:0:12}"
          for i in {1..24}; do
            if curl -fsSL --max-time 15 "$base/mobile.html?build=$version" -o /tmp/mobile.html && grep -Fq "pedome-$version.js" /tmp/mobile.html && curl -fsSL --max-time 15 "$base/js/pedome-ui-$version.js" -o /tmp/hud.js && grep -Fq 'data-drive="forward"' /tmp/hud.js && grep -Fq '© Direção-Geral do Território, CC BY 4.0' /tmp/mobile.html && curl -fsSL --max-time 30 "$base/js/terrain.bin.gz?build=$version" -o /tmp/public-terrain.gz && test "$(sha256sum /tmp/public-terrain.gz | cut -d' ' -f1)" = 9009db14b6808e36f3457db525eef2589328ac2769fe1899a8d53598efc0758d; then
              echo "Public mobile entry and versioned HUD verified: $version"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public deployment not yet verified"
          exit 1
