name: Reproducible environment check
on:
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.devcontainer/**'
      - 'tools/setup-upstream.py'
      - '.github/workflows/environment-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Setup, build, test and serve
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          npm --version
          make setup
          .venv/bin/python -m pip check
          echo 'PACKAGE_LOCK_START'
          cat package-lock.json
          echo
          echo 'PACKAGE_LOCK_END'
          make build
          make test
          python -c 'import json; d=json.load(open("pedome/build-report.json")); assert not d["fixture"] and d["flat"] and d["roads"]==179 and d["buildings"]==527; print("BUILD_REPORT",json.dumps(d))'
          make serve PORT=8080 > /tmp/mapslop-serve.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8080/ > /tmp/mapslop-index.html; then break; fi; sleep 1; done
          grep -Fq 'MapSlop' /tmp/mapslop-index.html
          curl -fsS http://127.0.0.1:8080/js/pedome-ui.js | grep -Fq 'installPedomeUI'
          echo 'MAKE_SERVE_OK'
      - name: Build devcontainer and check versions
        run: |
          docker build --tag mapslop-devcontainer -f .devcontainer/Dockerfile .devcontainer
          docker run --rm mapslop-devcontainer sh -c 'python --version && node --version && npm --version && git --version && make --version'
