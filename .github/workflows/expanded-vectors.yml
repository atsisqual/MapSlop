name: Archive expanded Pedome vector data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install requests==2.32.5
      - name: Download OGC vector layers
        id: ogc
        continue-on-error: true
        run: python -u tools/collect-ogc-pedome.py --output /tmp/pedome-vectors
      - name: Derive expanded OSM data from exact archived Portugal snapshot
        id: osm
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pedome-vectors /tmp/osm
          gh release download geodata-portugal-20261126 --repo "$GITHUB_REPOSITORY" --pattern portugal-261126.osm.pbf --dir /tmp/osm
          echo '983c1ffcc59535d53b674ae0caeac3e4d25f28d93a7a635f2a9a531c4445bc91  /tmp/osm/portugal-261126.osm.pbf' | sha256sum -c
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          osmium extract --bbox=-8.405,41.405,-8.375,41.435 --strategy=complete_ways --output=/tmp/osm/pedome.osm /tmp/osm/portugal-261126.osm.pbf
          python tools/osm-xml-to-json.py /tmp/osm/pedome.osm /tmp/pedome-vectors/pedome-expanded-osm.json --bbox 41.405 -8.405 41.435 -8.375
      - name: Archive vector datasets in draft release
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pedome-vectors
          tag=geodata-pedome-vectors-20261127
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/vector-draft; then
            test "$(cat /tmp/vector-draft)" = true
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Pedome e arredores — dados vetoriais" --notes "Separate source datasets. DGT open vector data, attribution Direção-Geral do Território, CC BY 4.0 policy https://www.dgterritorio.gov.pt/dados-abertos ; OSM © OpenStreetMap contributors, ODbL 1.0 https://www.openstreetmap.org/copyright . Extended bbox -8.405,41.405,-8.375,41.435. OSM derived from exact archived 2026-11-26 Geofabrik extract if successful. Exploratory cadastral layers contain geometry only. No private account information."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >/tmp/vector-existing
          shopt -s nullglob
          files=(*.json *.geojson)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > "SHA256SUMS-${GITHUB_RUN_ID}.txt"
          for f in "${files[@]}" "SHA256SUMS-${GITHUB_RUN_ID}.txt"; do
            if ! grep -Fxq "$f" /tmp/vector-existing; then gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"; fi
          done
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-vector-reports
          path: |
            /tmp/pedome-vectors/vector-manifest.json
            /tmp/pedome-vectors/ogc-collection-inventory.json
            /tmp/pedome-vectors/SHA256SUMS-*.txt
          if-no-files-found: warn
      - name: Report partial acquisition as failure
        if: steps.ogc.outcome == 'failure' || steps.osm.outcome == 'failure'
        run: exit 1
