name: Pedome private orthophoto ground
on:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: private-orthophoto-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/agent/orthophoto-ground'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MAPSLOP_RESULTS: /tmp/ortho-results
      MAPSLOP_TEST_URL: http://127.0.0.1:8080/?webgl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned dependencies and verify clipping
        run: |
          python -m pip install -r requirements-buildings.txt Pillow==11.3.0
          node tests/orthophoto-partition.test.mjs
      - name: Retrieve reviewed private derivatives
        run: |
          set -euo pipefail
          mkdir -p /tmp/ortho-results /tmp/ortho-input/{ortho,trees,heights,roofs} /tmp/ortho-tiles
          fetch() {
            local tag="$1" dir="$2"; shift 2
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern SHA256SUMS.txt "$@"
          }
          check() {
            local dir="$1" file="$2"
            (cd "$dir"; grep -E "^[0-9a-f]{64}  $file$" SHA256SUMS.txt | sha256sum -c -)
          }
          fetch geodata-dgt-orthophoto-46096919931-1 /tmp/ortho-input/ortho --pattern orthophoto-tiles.tar.gz --pattern orthophoto-render-report.json
          check /tmp/ortho-input/ortho orthophoto-tiles.tar.gz
          check /tmp/ortho-input/ortho orthophoto-render-report.json
          tar -xzf /tmp/ortho-input/ortho/orthophoto-tiles.tar.gz -C /tmp/ortho-tiles
          fetch geodata-dgt-vegetation-46095666103-1 /tmp/ortho-input/trees --pattern vegetation-candidates.json --pattern vegetation-report.json
          check /tmp/ortho-input/trees vegetation-candidates.json
          check /tmp/ortho-input/trees vegetation-report.json
          fetch geodata-dgt-buildings-agent-dgt-building-heights /tmp/ortho-input/heights --pattern building-heights.json --pattern preview-height-verification.json
          check /tmp/ortho-input/heights building-heights.json
          check /tmp/ortho-input/heights preview-height-verification.json
          fetch geodata-dgt-roofs-agent-building-roofs-facades /tmp/ortho-input/roofs --pattern converted-roofs.tar.gz --pattern building-detail-report.json
          check /tmp/ortho-input/roofs converted-roofs.tar.gz
          check /tmp/ortho-input/roofs building-detail-report.json
          tar -xzf /tmp/ortho-input/roofs/converted-roofs.tar.gz -C /tmp/ortho-input/roofs
      - name: Fetch approved immutable terrain and pinned upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/ortho-terrain
          tag=geodata-dgt-pages-road-46085062868
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/ortho-terrain --pattern terrain-road-preview.bin --pattern road-validation.json
          python tools/verify-pages-terrain.py /tmp/ortho-terrain
          echo '36019dfc27584d667555c794350107c29981da4f4ee15bac2c03078aba0d895b  /tmp/ortho-terrain/terrain-tin.bin' | sha256sum -c -
          git init /tmp/nairobi
          git -C /tmp/nairobi remote add origin https://github.com/briankariuki/slop-nairobi.git
          git -C /tmp/nairobi fetch --depth=1 origin 64b8599ae7dd7ba56ffbe68f19cc1423a9e7f903
          git -C /tmp/nairobi checkout --detach FETCH_HEAD
          git init /tmp/three
          git -C /tmp/three remote add origin https://github.com/mrdoob/three.js.git
          git -C /tmp/three sparse-checkout set build examples/jsm
          git -C /tmp/three fetch --depth=1 --filter=blob:none origin f17eb5d689094a3fbd4cd0d64d54729a48036ce0
          git -C /tmp/three checkout --detach FETCH_HEAD
          mkdir /tmp/three-vendor
          cp -r /tmp/three/build /tmp/three/examples /tmp/three/LICENSE /tmp/three-vendor/
      - name: Verify reviewed inputs and build both variants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from terrain_binary import decode
          r=Path('/tmp/ortho-input');tiles=Path('/tmp/ortho-tiles')
          def load(p):return json.loads(p.read_text())
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert load(r/'ortho/orthophoto-render-report.json')['pass']
          t=decode(Path('/tmp/ortho-terrain/terrain-tin.bin').read_bytes())
          m=load(tiles/'manifest.json')
          assert m['terrain_sha256']==sha(Path('/tmp/ortho-terrain/terrain-tin.bin')) and len(m['tiles'])==64
          for tile in m['tiles']:
              for d in tile['levels'].values():
                  p=tiles/d['path'];assert p.stat().st_size==d['bytes'] and sha(p)==d['sha256']
          assert len(load(r/'trees/vegetation-candidates.json')['trees'])==5702
          h=load(r/'heights/building-heights.json')
          p=Path('data/pedome/pedome-osm.json')
          assert sha(p)==h['osm_sha256']
          v=load(r/'heights/preview-height-verification.json');assert v['pass'] and v['matched']==370 and v['excluded_count']==1
          osm=load(p);heights={row['osm_id']:row['height_m'] for row in h['rows'] if row.get('preview_policy')=='raster_p90_candidate'}
          assert len(heights)==371
          for e in osm['elements']:
              if e['type']=='way' and e['id'] in heights:e['tags']['height']=str(heights[e['id']])
          (r/'height-preview-osm.json').write_text(json.dumps(osm,allow_nan=False))
          roof=load(r/'roofs/building-detail-report.json');assert roof['pass'] and roof['measured']>=17
          converted=load(r/'roofs/converted/roof-conversion-report.json')
          assert abs(converted['vertical_reference']['base_absolute_m']-t['base'])<.0001
          inputs={str(p.relative_to(r)):sha(p) for p in r.rglob('*') if p.is_file() and p.suffix in ('.json','.gz')}
          Path('/tmp/ortho-results/combined-inputs.json').write_text(json.dumps(inputs,indent=2))
          PY
          for variant in before after; do
            out=/tmp/pedome-$variant
            python tools/prepare-pedome.py /tmp/nairobi "$out" --osm-json /tmp/ortho-input/height-preview-osm.json --building-preview --roof-preview /tmp/ortho-input/roofs/converted/roof-preview.json --terrain-bin /tmp/ortho-terrain/terrain-tin.bin --three-vendor /tmp/three-vendor
            cmp /tmp/ortho-terrain/terrain-tin.bin "$out/js/terrain.bin"
            args=()
            if [ "$variant" = before ]; then args+=(--baseline); fi
            python tools/install-combined-preview.py "$out" /tmp/ortho-tiles /tmp/ortho-input/trees/vegetation-candidates.json data/pedome/pedome-osm.json "${args[@]}"
            node --check "$out/js/pedome.js"
            node --check "$out/js/street-geometry.js"
            node --check "$out/js/pedome-buildings-detail.mjs"
            node --check "$out/js/road-network.js"
          done
          cp /tmp/pedome-after/combined-source-report.json /tmp/ortho-results/
          cp /tmp/ortho-tiles/manifest.json /tmp/ortho-results/
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Joint real browser comparison and performance
        run: |
          set -euo pipefail
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/pedome-before > /tmp/ortho-results/before.log 2>&1 &
          before=$!
          python -m http.server 8081 --bind 127.0.0.1 --directory /tmp/pedome-after > /tmp/ortho-results/after.log 2>&1 &
          after=$!
          trap 'kill "$before" "$after" || true' EXIT
          for port in 8080 8081; do
            for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi; sleep 1; done
          done
          node tests/combined-real.mjs
      - name: Preserve exact candidate runtime for later authorized Pages preflight
        run: |
          set -euo pipefail
          tar -C /tmp/pedome-after -czf /tmp/ortho-results/combined-runtime.tar.gz js ortho index.html build-report.json
          test "$(stat -c %s /tmp/ortho-results/combined-runtime.tar.gz)" -lt 50000000
      - name: Preserve tiles and evidence in unique draft only
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/ortho-results
          if [ -d /tmp/ortho-tiles ]; then tar -C /tmp/ortho-tiles -czf /tmp/ortho-results/orthophoto-tiles.tar.gz .; fi
          cd /tmp/ortho-results
          shopt -s nullglob
          files=(*.json *.png *.log *.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then echo 'No evidence'; exit 1; fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          mkdir -p /tmp/pedome-orthophoto-archive-artifact
          cp --parents "${files[@]}" SHA256SUMS.txt /tmp/pedome-orthophoto-archive-artifact/
          if [ "$GITHUB_REF" != refs/heads/main ] || { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_EVENT_NAME" != push ]; }; then
            echo "Release writes disabled outside main dispatch/push; preserving Actions artifact."
            exit 0
          fi
          tag=geodata-dgt-orthophoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Private combined evidence ${GITHUB_RUN_ID}" --notes "Joint preview: original data never published; visual review and Pages preflight required." "${files[@]}" SHA256SUMS.txt
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          echo "PRIVATE_EVIDENCE $tag"
      - name: Preserve curated derivatives and evidence as Actions artifact
        if: always() && (github.ref != 'refs/heads/main' || (github.event_name != 'workflow_dispatch' && github.event_name != 'push'))
        uses: actions/upload-artifact@v4
        with:
          name: pedome-orthophoto-evidence
          path: /tmp/pedome-orthophoto-archive-artifact/
          if-no-files-found: warn
