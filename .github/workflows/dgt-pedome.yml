name: DGT Pedome downloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dgt-pedome.yml'
      - 'tools/download-dgt-pedome.py'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Attempt standard public downloads without credentials
        run: python -u tools/download-dgt-pedome.py --output /tmp/dgt-pedome
      - name: Preserve result manifest (no raster redistribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgt-pedome-download-report
          path: /tmp/dgt-pedome/manifest.json
          if-no-files-found: warn
