        run: |
          set -euo pipefail
          export PYTHONPATH=/tmp/roof-tool/cjio-master
          .venv/bin/python tools/convert-roofer-preview.py --archive /tmp/roof-input/roofer-cityjson.tar.gz --summary /tmp/roof-input/roofer-summary.json --terrain /tmp/roof-input/terrain-tin.bin --output /tmp/roof-results/converted
      - name: Build and render private preview
        run: |
          set -euo pipefail
          root=/tmp/roof-results
          .venv/bin/python tools/prepare-pedome.py .cache/mapslop/nairobi outputs/roof-preview --osm-json /tmp/roof-input/height-preview-osm.json --terrain-bin /tmp/roof-input/terrain-tin.bin --building-preview --roof-preview "$root/converted/roof-preview.json" --three-vendor .cache/mapslop/three-vendor
          npx playwright install --with-deps chromium
          make serve OUT=outputs/roof-preview PORT=8080 > "$root/http.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi; sleep 1; done
          export MAPSLOP_TEST_URL=http://127.0.0.1:8080/?webgl MAPSLOP_RESULTS="$root" MAPSLOP_EXPECT_TERRAIN='DGT MDT 0.5 m' MAPSLOP_LONG_DRIVE=1
          status=0
          node tests/browser-smoke.mjs || status=1
          node tests/building-detail-browser.mjs || status=1
          exit "$status"
      - name: Retain only private conversion and diagnostics
        if: always()
        run: |
          set -euo pipefail
          root=/tmp/roof-results
          if [ ! -d "$root/converted" ]; then exit 0; fi
          case "$GITHUB_REF" in
            refs/heads/agent/building-roofs-facades) tag=geodata-dgt-roofs-agent-building-roofs-facades ;;
            refs/heads/main) tag=geodata-dgt-roofs-main ;;
            *) exit 1 ;;
          esac
          cd "$root"
          tar -czf converted-roofs.tar.gz converted
          files=(converted-roofs.tar.gz)
          for f in converted/roof-conversion-report.json building-detail-report.json browser-report.json roof-preview.png pedome-mobile.png; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          files+=(SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/roofs-draft 2>/dev/null; then
            test "$(cat /tmp/roofs-draft)" = true
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Private roof and facade experiment" --notes "Experimental derivatives. Never publish without explicit approval."
          fi
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
