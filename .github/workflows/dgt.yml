name: DGT manual acquisition
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilot probe (manifest only), expanded archive, LAZ, history or one collection'
        type: choice
        required: true
        default: pilot-authenticated
        options:
          - pilot-public
          - pilot-authenticated
          - expanded
          - laz
          - historical
          - collection
      collection:
        description: 'Used only with mode=collection'
        type: choice
        default: MDT-50cm
        options:
          - MDT-50cm
          - MDS-50cm
          - MDT-2m
          - MDS-2m
          - LAZ
          - ORTOS-2025
      snapshot:
        description: 'Release archive date YYYYMMDD; never overwrites existing assets'
        type: string
        required: true
        default: '20261127'
permissions:
  contents: read
concurrency:
  group: dgt-manual-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
      COLLECTION: ${{ inputs.collection }}
      SNAPSHOT: ${{ inputs.snapshot }}
      OUTPUT: /tmp/mapslop-dgt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements.txt
      - name: Validate requested mode (no credentials)
        run: python tools/dgt-workflow.py plan --mode "$MODE" --collection "$COLLECTION" --snapshot "$SNAPSHOT" --output "$OUTPUT"
      - name: Public pilot probe
        if: inputs.mode == 'pilot-public'
        id: public
        continue-on-error: true
        run: python tools/dgt-workflow.py collect --mode "$MODE" --collection "$COLLECTION" --snapshot "$SNAPSHOT" --output "$OUTPUT"
      - name: Authenticated acquisition
        if: inputs.mode != 'pilot-public'
        id: collect
        continue-on-error: true
        env:
          DGT_USERNAME: ${{ secrets.DGT_USERNAME }}
          DGT_PASSWORD: ${{ secrets.DGT_PASSWORD }}
        run: |
          test -n "$DGT_USERNAME" && test -n "$DGT_PASSWORD" || { echo "::error::Missing DGT repository secrets"; exit 1; }
          python tools/dgt-workflow.py collect --mode "$MODE" --collection "$COLLECTION" --snapshot "$SNAPSHOT" --output "$OUTPUT"
      - name: Archive verified originals in draft release (never publish or overwrite)
        if: always() && steps.collect.outcome != 'skipped' && inputs.mode != 'pilot-authenticated' && inputs.mode != 'pilot-public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/dgt-workflow.py archive --mode "$MODE" --collection "$COLLECTION" --snapshot "$SNAPSHOT" --output "$OUTPUT"
      - name: Save verification manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgt-manifest
          path: /tmp/mapslop-dgt/manifest.json
          if-no-files-found: warn
      - name: Fail honestly on partial acquisition
        if: always() && (steps.collect.outcome == 'failure' || steps.public.outcome == 'failure')
        run: exit 1
