name: Pedome browser validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Fetch exact upstream and Three.js revisions
        run: |
          git init /tmp/nairobi
          git -C /tmp/nairobi remote add origin https://github.com/briankariuki/slop-nairobi.git
          git -C /tmp/nairobi fetch --depth=1 origin 64b8599ae7dd7ba56ffbe68f19cc1423a9e7f903
          git -C /tmp/nairobi checkout --detach FETCH_HEAD
          git init /tmp/three
          git -C /tmp/three remote add origin https://github.com/mrdoob/three.js.git
          git -C /tmp/three sparse-checkout set build examples/jsm
          git -C /tmp/three fetch --depth=1 --filter=blob:none origin f17eb5d689094a3fbd4cd0d64d54729a48036ce0
          git -C /tmp/three checkout --detach FETCH_HEAD
          mkdir -p /tmp/three-vendor
          cp -r /tmp/three/build /tmp/three/examples /tmp/three/LICENSE /tmp/three-vendor/
      - name: Build actual Pedome map without external map services
        run: python tools/prepare-pedome.py /tmp/nairobi /tmp/pedome --osm-json data/pedome/pedome-osm.json --flat --three-vendor /tmp/three-vendor
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pedome-browser
          cd /tmp/pedome-browser
          npm install --no-audit --no-fund --save-exact playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render and drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pedome-results
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/pedome > /tmp/pedome-results/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi; sleep 1; done
          cd /tmp/pedome-browser
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1280,height:720}});
          const errors=[], consoleLog=[], failed=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>consoleLog.push({type:m.type(),text:m.text()}));
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
          page.on('response',r=>{if(r.status()>=400)failed.push({url:r.url(),status:r.status()})});
          // All runtime assets should be local; fail unexpected external requests rather than depending on CDN.
          await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8080/')?r.continue():r.abort());
          let report={errors,consoleLog,failed};
          try {
            await page.goto('http://127.0.0.1:8080/?webgl',{waitUntil:'load',timeout:90000});
            await page.waitForFunction(()=>window.mapslop?.ready===true,{},{timeout:120000});
            const state=()=>page.evaluate(()=>{const e=window.mapslop.controllers.getActiveEntity();return {mode:window.mapslop.controllers.activeMode,x:e.position.x,y:e.position.y,z:e.position.z,speed:e.speed,heading:e.heading,status:document.querySelector('#status').textContent,canvas:!!document.querySelector('canvas'),roads:window.mapslop.GEO.roads.length,buildings:window.mapslop.GEO.buildings.length}});
            report.before=await state();
            await page.screenshot({path:'/tmp/pedome-results/pedome-start.png',timeout:60000});
            await page.keyboard.down('w');
            try { await page.waitForFunction(()=>Math.abs(window.mapslop.controllers.getActiveEntity().speed)>1,{},{timeout:60000}); await page.waitForFunction(({x,z})=>{const p=window.mapslop.controllers.getActiveEntity().position;return Math.hypot(p.x-x,p.z-z)>2;},report.before,{timeout:90000}); } finally { await page.keyboard.up('w'); }
            report.after=await state();
            report.distance=Math.hypot(report.after.x-report.before.x,report.after.z-report.before.z);
            await page.screenshot({path:'/tmp/pedome-results/pedome-driving.png',timeout:60000});
            if(report.before.mode!=='car'||!report.before.canvas||report.before.roads!==179||report.before.buildings!==527||!Number.isFinite(report.distance)||report.distance<1||errors.length||consoleLog.some(m=>m.type==='error'||/GL_INVALID_OPERATION|GL_INVALID_FRAMEBUFFER_OPERATION|shader error/i.test(m.text))||failed.some(r=>!r.url.endsWith('/favicon.ico')))throw Error('Browser driving validation failed');
            report.success=true;
          } catch(e) {
            report.success=false; report.error=e.message;
            report.status=await page.locator('#status').textContent({timeout:5000}).catch(()=>null);
            await page.screenshot({path:'/tmp/pedome-results/failure.png',timeout:30000}).catch(()=>{});
            throw e;
          } finally {
            fs.writeFileSync('/tmp/pedome-results/browser-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          }
          JS
          node smoke.mjs
      - name: Upload diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pedome-browser-evidence
          path: /tmp/pedome-results/
          if-no-files-found: warn
