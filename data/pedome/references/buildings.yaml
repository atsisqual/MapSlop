      porta_principal:
        enabled: true
        azimute_graus: 270
        aresta: null
        fracao_aresta: 0.5
        largura_m: 1.5
        altura_m: 2.55
      janelas:
        enabled: true
        largura_m: 0.75
        altura_m: 1.4
        peitoril_m: 2.1
        intervalo_m: 4.2
        posicoes: null
      cunhais_granito:
        enabled: true
        largura_m: 0.28
      cornija_granito:
        enabled: true
        altura_m: 0.22
      material_parede: plaster
      cor_parede_rgb: [0.92, 0.92, 0.90]
      fator_luz_cobertura: 0.22
      cor_granito_rgb: [0.47, 0.45, 0.42]
