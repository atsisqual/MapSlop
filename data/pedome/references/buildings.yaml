    descricao: "Igreja de Pedome"
    zona: igreja
    cor_fachada: "Branco, granito cinzento nos remates"
    material: "Granito estrutural com reboco de argamassa; granito aparente nas molduras, cunhais, cornijas e empenas"
    pisos: null
    tipo_telhado: "Telha cerâmica avermelhada; coruchéu preservado pelo LiDAR"
    varandas: null
    portoes_muros: null
    fonte_referencia: "https://www.jf-pedome.pt/freguesia/locais-a-visitar/2-igreja_paroquial_de_pedome"
